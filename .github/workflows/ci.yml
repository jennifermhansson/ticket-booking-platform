name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.3.6
  IMAGE_PREFIX: ghcr.io/jennifermhansson/ticket-booking-platform

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.15.0
        with:
          context: ${{ matrix.app }}
          build-args: BUN_VERSION=${{ env.BUN_VERSION }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          # One cache per image, or each matrix leg overwrites the other's.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue deploys instead of cancelling one halfway through a rollout.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # One SSH connection only: ufw rejects 6 new connections within 30 seconds.
      # The database manifests go first, so Postgres exists before the app (ADR 0007).
      - name: Apply manifests and wait for the rollout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sed -i "s|:IMAGE_TAG|:${GITHUB_SHA}|" k8s/*.yaml
          cat k8s/database/*.yaml k8s/*.yaml | ssh -o BatchMode=yes -o ConnectTimeout=15 "deploy@${DEPLOY_HOST}" \
            'kubectl apply -n tickets -f - && kubectl -n tickets rollout status statefulset/postgres --timeout=120s && kubectl -n tickets rollout status deployment/backend --timeout=120s && kubectl -n tickets rollout status deployment/frontend --timeout=120s'
      - name: Check /health over HTTPS
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://api.tickets.philipzachariasson.dev/health
      # --retry-all-errors also retries TLS errors: until cert-manager has issued
      # a new host's certificate, Traefik serves its self-signed default one.
      - name: Check the cdn page over HTTPS
        run: curl --fail --silent --show-error --output /dev/null --retry 20 --retry-delay 6 --retry-all-errors https://cdn.tickets.philipzachariasson.dev/
