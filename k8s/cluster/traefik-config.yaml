---
# Overrides values of the Traefik chart that k3s installs. k3s merges this
# into its own chart values, so the change survives k3s upgrades.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        # A LoadBalancer service gets NodePorts by default, and kube-proxy
        # opens them before ufw sees the traffic. ServiceLB forwards 80/443
        # to Traefik's ClusterIP, not to the NodePorts, so they only add
        # open ports. Recheck before setting externalTrafficPolicy: Local.
        allocateLoadBalancerNodePorts: false
    # Requests per second, response times and status codes per Kubernetes
    # service, for the Grafana dashboard (ADR 0013). Apply after
    # kube-prometheus-stack: the chart skips the ServiceMonitor until its CRD
    # exists. The finer buckets replace the default 0.1/0.3/1.2/5 s, too
    # coarse for a p95 of a few milliseconds.
    metrics:
      prometheus:
        buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5"
        service:
          enabled: true
        serviceMonitor:
          enabled: true
