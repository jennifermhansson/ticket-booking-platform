---
# Applied by k8s/deploy.sh with `kubectl apply -n tickets`, so no object names a namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # No replicas: the HorizontalPodAutoscaler below owns the count, and a value
  # here would reset it on every apply in deploy.sh.
  selector:
    matchLabels:
      app: backend
  # A new pod must be ready before an old one goes, so a rollout never runs
  # with fewer ready pods than the HPA asks for (ADR 0015).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Counts from the start of preStop, so it must cover the 10 s sleep plus
      # the drain; requests take milliseconds. After it, Kubernetes sends SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # k8s/deploy.sh replaces IMAGE_TAG with the commit SHA (ADR 0006).
          image: ghcr.io/jennifermhansson/ticket-booking-platform-backend:IMAGE_TAG
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            # How long a reservation holds a ticket. Lower it for load and spike tests.
            - name: RESERVATION_SECONDS
              value: "300"
            # The only origin whose browser calls CORS lets through (#13).
            - name: CORS_ORIGINS
              value: https://cdn.tickets.philipzachariasson.dev
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Keeps serving while the removal from the EndpointSlice reaches
          # Traefik; only then does SIGTERM start the drain in server.ts.
          # The built-in sleep action needs no sleep binary in the image.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # Percent of requests.cpu (100m), so 50m per pod. Low because the backend
    # mostly waits on Postgres and spends little CPU per request.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # The default is 300s; 60s lets the scale-down show within a demo.
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.tickets.philipzachariasson.dev
      secretName: backend-tls
  rules:
    - host: api.tickets.philipzachariasson.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
