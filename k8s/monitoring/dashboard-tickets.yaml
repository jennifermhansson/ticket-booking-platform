---
# The tickets dashboard. Grafana's sidecar loads every ConfigMap labelled
# grafana_dashboard: "1". Dashboards loaded this way cannot be saved from the
# UI: edit there, then Export → JSON and paste it below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-tickets
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  tickets.json: |-
    {
      "uid": "tickets",
      "title": "Tickets",
      "tags": ["tickets"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "app",
            "label": "App (logs)",
            "type": "custom",
            "query": "backend,frontend,postgres,migrate,postgres-backup",
            "current": { "text": "backend", "value": "backend" },
            "includeAll": true,
            "allValue": ".+",
            "multi": false
          },
          {
            "name": "search",
            "label": "Search logs",
            "type": "textbox",
            "query": "",
            "current": { "text": "", "value": "" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second (backend)",
          "description": "From Traefik: every request to api.<domain>, before it reaches a pod.",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (method) (rate(traefik_service_requests_total{exported_service=\"tickets-backend-http@kubernetes\"}[$__rate_interval]))",
              "legendFormat": "{{method}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Response time (backend)",
          "description": "p50, p95 and p99 from Traefik's histogram, including the time spent in the backend and the database.",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=\"tickets-backend-http@kubernetes\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=\"tickets-backend-http@kubernetes\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=\"tickets-backend-http@kubernetes\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Responses by status code (backend)",
          "description": "5xx are errors. 409 means the ticket was already taken: expected under load, not an error.",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (code) (rate(traefik_service_requests_total{exported_service=\"tickets-backend-http@kubernetes\", code!~\"2..\"}[$__rate_interval]))",
              "legendFormat": "{{code}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Error rate (5xx)",
          "description": "Share of backend responses that were 5xx. Shows 0 when there is no traffic.",
          "gridPos": { "x": 0, "y": 8, "w": 4, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.001 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(traefik_service_requests_total{exported_service=\"tickets-backend-http@kubernetes\", code=~\"5..\"}[$__rate_interval])) or vector(0)) / clamp_min(sum(rate(traefik_service_requests_total{exported_service=\"tickets-backend-http@kubernetes\"}[$__rate_interval])), 1e-9)"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend pods",
          "description": "Ready backend pods, and what the autoscaler (#24) wants once it exists.",
          "gridPos": { "x": 4, "y": 8, "w": 4, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"tickets\", deployment=\"backend\"})",
              "legendFormat": "ready"
            },
            {
              "refId": "B",
              "expr": "sum(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"tickets\"})",
              "legendFormat": "HPA desired"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU per pod (tickets)",
          "gridPos": { "x": 8, "y": 8, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "cores" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"tickets\", container!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Memory per pod (tickets)",
          "description": "Working set: what counts against the pod's memory limit.",
          "gridPos": { "x": 16, "y": 8, "w": 8, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"tickets\", container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Logs: $app",
          "description": "From Loki. Fastify logs JSON; add | json | level >= 50 in Explore to see only errors.",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"tickets\", app=~\"$app\"} |= \"$search\""
            }
          ]
        }
      ]
    }
