# Replaces the image's default.conf. Traefik passes the Host header through, so
# one pod answers both hosts: the page on <domain>, the assets on cdn.<domain>
# (ADR 0016). add_header is repeated per location because nginx drops the
# server-level ones in any location that sets its own.

server {
    # default_server: the probes call the pod IP, so they land here.
    listen 8080 default_server;
    server_name tickets.philipzachariasson.dev;
    root /usr/share/nginx/html;

    location / {
        try_files /index.html =404;
        # The page names the hashed assets, so it must be revalidated on every load.
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 8080;
    server_name cdn.tickets.philipzachariasson.dev;
    root /usr/share/nginx/html;

    location /assets/ {
        # A changed file gets a new hash in its name, so a cached copy never goes stale.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Vite marks the script and CSS tags crossorigin, so the browser refuses them without this.
        add_header Access-Control-Allow-Origin "https://tickets.philipzachariasson.dev";
    }

    location / {
        return 301 https://tickets.philipzachariasson.dev$request_uri;
    }
}
